name: Feature request
description: Propose a concrete capability or correctness improvement
body:
  - type: textarea
    id: outcome
    attributes:
      label: Desired behavior
      description: What should a user be able to do, and with which inputs?
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Evidence and verification
      description: Describe a synthetic fixture, resource bounds, failure cases, and how to test the result. No real heap attachments.
